name: Build DroidFish APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build DroidFish Debug APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 34 and NDK 25
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393"

      - name: Show Java version
        run: java -version

      - name: Show Android SDK information
        run: |
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Make Gradle executable
        working-directory: droidfish
        run: chmod +x gradlew

      - name: Clean previous Gradle build
        working-directory: droidfish
        run: ./gradlew clean

      - name: Build Debug APK
        working-directory: droidfish
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find droidfish -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidFish-debug-APK
          path: droidfish/DroidFishApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
